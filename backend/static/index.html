  input.focus();
}

function abrirModal(c, faceta){
  const addrCorta = c.address.slice(0,8)+'…'+c.address.slice(-4);
  const planta = plantaFor(c.address);
  const ops = agruparEpisodios(c.operaciones_recientes || []);

  // la posicion actual viene de clearinghouseState/spotClearinghouseState
  // (dato en vivo, preguntado directamente a Hyperliquid), no se calcula
  // sumando fills -- eso es lo que antes daba numeros sin sentido. Tambien
  // corrige el estado abierta/cerrada: el calculo por fills puede decir
  // "abierta" por error si el cierre real paso fuera de los 500 fills que
  // guardamos -- el dato en vivo manda siempre que este disponible.
  const posicionReal = c.posicion_actual || [];
  const holdingsSpot = c.holdings_spot || [];
  const bloquesSinCorregir = construirBloques(ops);
  // bloquesSinCorregir viene ordenado de mas reciente a mas antiguo, asi que
  // el primero que aparece para cada clave coin+lado es el mas reciente --
  // SOLO ese puede ser "la" posicion abierta ahora mismo. Episodios mas
  // antiguos de la misma moneda+lado que ya se cerraron en su momento (p.ej.
  // abrio y cerro un short en HYPE hace semanas, y ahora tiene otro short en
  // HYPE abierto) no deben heredar el estado "abierta" del actual.
  const masRecientePorClave = {};
  for(const b of bloquesSinCorregir){
    const clave = `${b.lado}|${b.coin}`;
    if(b.lado && masRecientePorClave[clave] == null) masRecientePorClave[clave] = b;
  }
  // misma fila "sintetica" que en Posiciones de seguimiento (ver
  // movimientoSintetico): si el ciclo de 5 min ya vio un cambio que el
  // backtest diario (estas filas de aqui, ops) todavia no tiene como fill
  // real, se añade igual -- antes el modal se quedaba sin verlo hasta 24h
  // despues, aunque Telegram ya hubiera avisado y "Posiciones de
  // seguimiento" ya lo mostrara. Solo aplica al bloque mas reciente de su
  // clave (los antiguos, ya cerrados hace tiempo, no tienen nada pendiente).
  const bloques = bloquesSinCorregir.map(b=>{
    if(!b.lado || masRecientePorClave[`${b.lado}|${b.coin}`] !== b) return b;
    const abiertaReal = b.lado === 'Spot'
      ? holdingsSpot.some(h=>h.coin===nombreMonedaBase(b.coin))
      : posicionReal.some(p=>p.coin===b.coin && p.lado===b.lado);
    const clave = b.lado === 'Spot' ? `${c.address}_spot_${b.coin}` : `${c.address}_trading_${b.coin}_${b.lado}`;
    const al = alertas[clave];
    const ultimaReal = b.filas[b.filas.length-1];
    let filas = b.filas;
    if(al && al.detectado!=null && (!ultimaReal || al.detectado > ultimaReal.ts)){
      let precio, costeProm = null;
      if(b.lado === 'Spot'){
        const h = holdingsSpot.find(x=>x.coin===b.coin);
        precio = (al.precio!=null) ? al.precio
          : (h && h.valorActual!=null && h.tamaño) ? h.valorActual/h.tamaño
          : (h && h.costeBase!=null && h.tamaño) ? h.costeBase/h.tamaño : null;
        costeProm = (h && h.costeBase!=null && h.tamaño) ? h.costeBase/h.tamaño : null;
      } else {
        const p = posicionReal.find(x=>x.coin===b.coin && x.lado===b.lado);
        precio = al.precio!=null ? al.precio : (p ? p.entryPx : null);
      }
      const sintetico = precio!=null ? movimientoSintetico(clave, al.detectado, b.coin, precio, costeProm) : null;
      if(sintetico) filas = [...b.filas, sintetico];
    }
    return {...b, filas, abierta: abiertaReal};
  });

  // igual que en Posiciones de seguimiento: una venta total deja de aparecer
  // en holdingsSpot (dato en vivo) al instante -- sin esto, esta tabla la
  // mostraba vacia para esa moneda como si nunca hubiera pasado nada, aunque
  // Telegram si hubiera avisado. Se muestra igual mientras siga "reciente".
  const VENTANA_SPOT_CERRADO_RECIENTE_MS = 72 * 3600 * 1000;
  const spotCerradoReciente = Object.values(alertas).filter(a =>
    a.tipo === 'spot' && a.addr === c.address && a.tamaño === 0 && a.detectado != null
    && Date.now() - a.detectado <= VENTANA_SPOT_CERRADO_RECIENTE_MS
    && !holdingsSpot.some(h => h.coin === a.coin)
  );
  const spotTablaHtml = (holdingsSpot.length || spotCerradoReciente.length) ? [
    ...holdingsSpot.map(h=>{
      const coste = h.costeBase!=null ? `$${h.costeBase.toLocaleString('es-ES',{maximumFractionDigits:0})}` : `<span title="Hyperliquid no tiene registrado cuánto le costó comprar esto — puede que lo recibiera (airdrop, transferencia) en vez de comprarlo aquí" style="color:var(--fg-muted)">sin dato</span>`;
      const valor = h.valorActual!=null ? `$${h.valorActual.toLocaleString('es-ES',{maximumFractionDigits:0})}` : '—';
      const pnlClase = h.pnlNoRealizado > 0 ? 'pos' : (h.pnlNoRealizado < 0 ? 'neg' : '');
      const pnl = h.pnlNoRealizado!=null ? `<span class="op-pnl ${pnlClase}">${h.pnlNoRealizado>0?'+':''}$${h.pnlNoRealizado.toLocaleString('es-ES',{maximumFractionDigits:0})}</span>` : '—';
      return `
      <tr>
        <td>${etiquetaMoneda(h.coin)}</td>
        <td>${h['tamaño']}</td>
        <td>${coste}</td>
        <td>${valor}</td>
        <td>${pnl}</td>
      </tr>`;
    }),
    ...spotCerradoReciente.map(a=>{
      const valorVendido = (a.tamaño_antes!=null && a.precio!=null) ? a.tamaño_antes*a.precio : null;
      const costeTxt = valorVendido!=null ? `-$${valorVendido.toLocaleString('es-ES',{maximumFractionDigits:0})}` : `<span style="color:var(--fg-muted)">sin dato</span>`;
      return `
      <tr>
        <td>${etiquetaMoneda(a.coin)} <span class="op-estado cerrada">vendida</span></td>
        <td>0</td>
        <td>${costeTxt}</td>
        <td>—</td>
        <td>—</td>
      </tr>`;
    }),
  ].join('') : '<tr><td colspan="5" class="estado">Sin nada en cartera spot ahora mismo.</td></tr>';

  // solo para trading (long/short) -- spot ya no agrupa por bloque, ver
  // filasSpotPlanas mas abajo
  const filaHijo = (o, bloqueId)=>{
    const pnlClase = o.closedPnl > 0 ? 'pos' : (o.closedPnl < 0 ? 'neg' : '');
    const pnlTexto = o.closedPnl ? `${o.closedPnl>0?'+':''}$${o.closedPnl.toFixed(2)}` : '—';
    const esEntrada = o.accion === 'Abre';
    // en dolares, igual que la cabecera y que el resto de la tabla -- antes
    // esta celda era la unica en unidades de la moneda (0.5, 1.84...) en
    // medio de columnas que son todas $, sin ningun sentido visual
    const tamañoCelda = o.notional!=null ? `${esEntrada?'+':'-'}$${o.notional.toLocaleString('es-ES',{maximumFractionDigits:0})}` : '—';
    const verbo = esEntrada ? 'Añade' : (o.cierraDelTodo ? 'Cierra' : 'Reduce');
    return `
      <tr class="op-hijo oculto" data-hijo-de="${bloqueId}">
        <td>${verbo}</td>
        <td></td>
        <td>${tamañoCelda}</td>
        <td>$${o.px}</td>
        <td>${tamañoCelda}</td>
        <td>${fechaLocal(o.ts)}</td>
        <td class="op-pnl ${pnlClase}">${pnlTexto}</td>
      </tr>`;
  };

  // dato en vivo para rellenar el "Resultado" de lo que sigue abierto -- el
  // historial de fills por si solo no sabe cuanto vale AHORA una posicion
  // abierta, eso hay que preguntarselo a la API, no inventarlo.
  const pnlEnVivoPerp = (coin, lado)=>{
    const p = posicionReal.find(x=>x.coin===coin && x.lado===lado);
    return p ? p.pnlNoRealizado : null;
  };

  // solo para trading (long/short): agrupa por posicion con una fila
  // cabecera resumen + sus movimientos desplegables. Spot NO usa esto (ver
  // filasSpotPlanas) porque ahi la cabecera por moneda duplicaba el dato en
  // vivo que ya se ve en la tabla "Spot (en vivo)" de arriba.
  let contadorBloque = 0;
  const renderBloques = (listaBloques, mensajeVacio)=>{
    // las posiciones abiertas van siempre primero, da igual la fecha de su
    // ultimo movimiento; el resto (ya cerradas) va despues, de mas reciente
    // a mas antigua.
    const ordenados = [...listaBloques].sort((a,b)=> (b.abierta?1:0) - (a.abierta?1:0));
    if(!ordenados.length) return `<tr><td colspan="7" class="estado">${mensajeVacio}</td></tr>`;
    return ordenados.map(b=>{
      const lado = b.lado.toLowerCase();
      const tituloLado = b.lado==='Long' ? 'Long: apuesta a que el precio SUBE' : 'Short: apuesta a que el precio BAJA';
      const pnlRealizado = b.filas.reduce((acc,o)=>acc+(o.closedPnl||0),0);
      const ultima = b.filas[b.filas.length-1]; // mas reciente fila del bloque
      const estadoTxt = b.abierta ? 'abierta' : 'cerrada';
      const bloqueId = 'b'+(contadorBloque++);
      const avisoTruncada = b.truncada
        ? `<span class="op-estado cerrada" title="El primer movimiento que tenemos de esto ya es una reducción/venta: existía antes de nuestro historial, así que esta cifra es solo lo que cambió en estas fechas, no el tamaño total.">⚠ histórico incompleto</span>`
        : '';

      // resultado a mostrar en la cabecera: si sigue abierta, lo que vale
      // AHORA (dato en vivo); si no, lo realmente ganado/perdido al cerrar
      let pnlHtml;
      if(b.abierta){
        const pnlVivo = pnlEnVivoPerp(b.coin, b.lado);
        if(pnlVivo != null){
          const clase = pnlVivo > 0 ? 'pos' : (pnlVivo < 0 ? 'neg' : '');
          pnlHtml = `<span class="op-pnl ${clase}" title="Lo que gana o pierde AHORA MISMO si cerrara ya, dato en vivo">${pnlVivo>0?'+':''}$${pnlVivo.toLocaleString('es-ES',{maximumFractionDigits:0})}</span>`;
        } else {
          pnlHtml = `<span class="op-pnl" title="No tenemos coste base en vivo para calcular cuánto gana o pierde ahora mismo">— (sin dato en vivo)</span>`;
        }
      } else {
        const clase = pnlRealizado > 0 ? 'pos' : (pnlRealizado < 0 ? 'neg' : '');
        pnlHtml = pnlRealizado ? `<span class="op-pnl ${clase}">${pnlRealizado>0?'+':''}$${pnlRealizado.toFixed(2)}</span>` : '—';
      }

      // en dolares, como todo lo demas en esta tabla -- antes se mezclaba
      // "+5 (cambio visible)" en unidades de la moneda entre columnas que
      // son todas $, y no habia manera de leerlo con sentido.
      let tamañoCabecera, tituloTamaño;
      if(b.abierta){
        const p = posicionReal.find(x=>x.coin===b.coin && x.lado===b.lado);
        const dolares = p ? p['tamaño']*p.entryPx : b.filas.reduce((a,o)=>a+(o.accion==='Abre'?(o.notional||0):-(o.notional||0)),0);
        tamañoCabecera = `$${Math.round(dolares).toLocaleString('es-ES')}`;
        tituloTamaño = 'Lo invertido ahora mismo en esta posición (precio de entrada × tamaño en vivo)';
      } else {
        const notionalAbre = b.filas.filter(o=>o.accion==='Abre').reduce((a,o)=>a+(o.notional||0),0);
        tamañoCabecera = `$${Math.round(notionalAbre).toLocaleString('es-ES')}`;
        tituloTamaño = 'Total invertido en esta posición a lo largo de todo el historial visible';
      }
      const flecha = b.filas.length > 1 ? `<span class="op-flecha" data-bloque="${bloqueId}">▸</span>` : '';
      const cabecera = `
        <tr class="op-cabecera">
          <td>${flecha}<span class="op-lado ${lado}" title="${tituloLado}">${b.lado}</span></td>
          <td>${nombreMoneda(b.coin)}</td>
          <td title="${tituloTamaño}">${tamañoCabecera}</td>
          <td>—</td>
          <td>—</td>
          <td>${fechaLocal(ultima.ts)}<span class="op-estado ${estadoTxt}" style="margin-left:6px" title="${b.abierta?'Sigue abierta ahora mismo':'Ya está cerrada del todo'}">${estadoTxt}</span> ${avisoTruncada}</td>
          <td>${pnlHtml}</td>
        </tr>`;
      const hijos = b.filas.length > 1 ? marcarCierres(b.filas).reverse().map(o=>filaHijo(o, bloqueId)).join('') : '';
      return cabecera + hijos;
    }).join('');
  };

  const bloquesTrading = bloques.filter(b=>b.lado === 'Long' || b.lado === 'Short');
  const tradingTablaHtml = renderBloques(bloquesTrading, 'Sin operaciones de trading (long/short) registradas todavía.');

  // en spot, a diferencia de trading, NO hay cabecera de agrupacion por
  // moneda -- esa cabecera duplicaba lo que ya se ve en vivo en la tabla
  // "Spot (en vivo)" de arriba (p.ej. "-$815"). Aqui es solo el listado
  // plano de compras/ventas, una fila por operacion, sin agrupar.
  const filasSpotPlanas = bloques.filter(b=>b.lado==='Spot').flatMap(b=>marcarCierres(b.filas)).sort((a,b)=>b.ts-a.ts);
  const spotMovimientosHtml = filasSpotPlanas.length ? filasSpotPlanas.map(o=>{
    const pnlClase = o.closedPnl > 0 ? 'pos' : (o.closedPnl < 0 ? 'neg' : '');
    const pnlTexto = o.closedPnl ? `${o.closedPnl>0?'+':''}$${o.closedPnl.toFixed(2)}` : '—';
    const esEntrada = o.accion === 'Abre';
    const tamañoCelda = o.notional!=null ? `${esEntrada?'+':'-'}$${o.notional.toLocaleString('es-ES',{maximumFractionDigits:0})}` : '—';
    const verbo = esEntrada ? 'Compra' : (o.cierraDelTodo ? 'Cierra' : 'Vende');
    return `
      <tr>
        <td>${verbo}</td>
        <td>${nombreMoneda(o.coin)}</td>
        <td>${tamañoCelda}</td>
        <td>$${o.px}</td>
        <td>${tamañoCelda}</td>
        <td>${fechaLocal(o.ts)}</td>
        <td class="op-pnl ${pnlClase}">${pnlTexto}</td>
      </tr>`;
  }).join('') : '<tr><td colspan="7" class="estado">Sin compras/ventas spot registradas todavía.</td></tr>';
  // si no hace trading de verdad, o si se abrio el modal desde la faceta
  // spot (tarjeta/fila de spot), la pestaña de trading solo estorba -- se
  // abre directamente en spot y ni se muestra el boton de esa pestaña.
  // Igualmente al reves si se abrio desde la faceta trading.
  const hayTrading = bloquesTrading.length > 0 && faceta !== 'spot';
  const hayModalSpot = faceta !== 'trading';

  const fondo = document.createElement('div');
  fondo.className = 'modal-fondo';
  fondo.innerHTML = `
    <div class="modal">
      <div class="modal-cabecera">
        <div class="avatar" style="background:${colorFor(c.address)}">${planta[0]}</div>
        <div>
          <div class="addr">${planta} <span style="color:var(--fg-muted);font-size:.72rem">(${addrCorta})</span></div>
          <div style="font-size:.76rem;color:var(--fg-muted)">${ops.length} operaciones más recientes (instantánea)</div>
        </div>
        <button class="modal-cerrar" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-tabs">
        ${hayTrading?`<button class="modal-tab activo" data-tab="trading">Trading (long/short)</button>`:''}
        ${hayModalSpot?`<button class="modal-tab ${hayTrading?'':'activo'}" data-tab="spot">Spot</button>`:''}
      </div>
      <div class="modal-lista">
        <div class="panel ${hayTrading?'':'oculto'}" data-panel="trading">
          <table class="ops">
            <thead><tr>
              <th title="Si apostaba a que el precio sube (Long) o baja (Short)">Dirección</th>
              <th title="La moneda sobre la que operó">Moneda</th>
              <th title="Lo invertido en dólares: en la cabecera, en esta posición entera; en cada movimiento, lo añadido (+) o reducido (-) esa vez">Tamaño</th>
              <th title="Precio al que se ejecutó esa operación">Precio</th>
              <th title="Tamaño × precio: el valor en dólares que movió esa operación">Inversión</th>
              <th title="Fecha y hora real de la operación (hora local). En la cabecera, fecha del último movimiento de esa posición">Fecha</th>
              <th title="Ganancia o pérdida ya realizada; vacío si la posición seguía abierta">Resultado</th>
            </tr></thead>
            <tbody>${tradingTablaHtml}</tbody>
          </table>
        </div>
        <div class="panel ${hayTrading||!hayModalSpot?'oculto':''}" data-panel="spot">
          <table class="ops">
            <thead><tr>
              <th title="La moneda que tiene comprada al contado">Moneda</th>
              <th title="Cantidad que tiene en cartera ahora mismo (dato en vivo)">Cantidad</th>
              <th title="Lo que ha invertido en total para tener esta cantidad (coste medio acumulado). 'Sin dato' si Hyperliquid no tiene registrada una compra (p.ej. lo recibió, no lo compró)">Coste base</th>
              <th title="Lo que vale esa cantidad ahora mismo, al precio de mercado actual">Valor actual</th>
              <th title="Valor actual menos coste base: lo que ganaría o perdería si lo vendiera ahora">Resultado</th>
            </tr></thead>
            <tbody>${spotTablaHtml}</tbody>
          </table>
          <h3 class="panel-subtitulo">Compras y ventas recientes</h3>
          <table class="ops">
            <thead><tr>
              <th title="Compra o venta al contado">Dirección</th>
              <th title="La moneda sobre la que operó">Moneda</th>
              <th title="Lo comprado (+) o vendido (-) en esa operación, en dólares">Tamaño</th>
              <th title="Precio al que se ejecutó esa operación">Precio</th>
              <th title="Dato en la tabla de arriba">Inversión</th>
              <th title="Fecha y hora real de la operación (hora local)">Fecha</th>
              <th title="Ganancia o pérdida ya realizada en ventas; vacío si es una compra que sigue en cartera">Resultado</th>
            </tr></thead>
            <tbody>${spotMovimientosHtml}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  fondo.onclick = (ev)=>{ if(ev.target===fondo) document.body.removeChild(fondo); };
  fondo.querySelector('.modal-cerrar').onclick = ()=> document.body.removeChild(fondo);
  fondo.querySelectorAll('.modal-tab').forEach(btn=>{
    btn.onclick = ()=>{
      fondo.querySelectorAll('.modal-tab').forEach(b=>b.classList.remove('activo'));
      btn.classList.add('activo');
      fondo.querySelectorAll('.panel').forEach(p=> p.classList.toggle('oculto', p.dataset.panel !== btn.dataset.tab));
    };
  });
  fondo.querySelectorAll('.op-flecha').forEach(fl=>{
    fl.onclick = (ev)=>{
      ev.stopPropagation();
      const id = fl.dataset.bloque;
      const seAbre = fl.textContent === '▸';
      fl.textContent = seAbre ? '▾' : '▸';
      fondo.querySelectorAll(`[data-hijo-de="${id}"]`).forEach(tr=> tr.classList.toggle('oculto', !seAbre));
    };
  });
  document.body.appendChild(fondo);
}

const INTERVALO_SONDEO_MS = 30000;

async function cargarTodo(){
  const [listaCandidatos, listaAlertas, listaMisPosiciones, listaNotificaciones] = await Promise.all([
    apiGet('/candidatos'), apiGet('/alertas'), apiGet('/mis_posiciones'), apiGet('/notificaciones'),
  ]);
  candidatos = listaCandidatos;
  alertas = {}; listaAlertas.forEach(a=>{ alertas[a.id] = a; });
  misPosiciones = {}; listaMisPosiciones.forEach(m=>{ misPosiciones[m.id] = m; });
  notificaciones = listaNotificaciones;
  await desseguirFiltrados();
}

// un candidato que se sigue puede caer en "vetado" (o perder la puntuacion)
// despues de haberlo seguido -- entonces desaparece del listado filtrado
// (ver renderPaginaSeguimiento) pero se queda "siguiendo" para siempre, sin
// forma de desmarcarlo desde la UI; se desengancha solo en cuanto se detecta
async function desseguirFiltrados(){
  const aLimpiar = candidatos.filter(c=>
    (c.sigue_trading && !(c.categoria==='especulativo' || c.puntuacion!=null)) ||
    (c.sigue_spot && c.puntuacion_spot==null));
  if(!aLimpiar.length) return;
  await Promise.all(aLimpiar.map(c=>{
    const cuerpo = {};
    if(c.sigue_trading && !(c.categoria==='especulativo' || c.puntuacion!=null)) cuerpo.sigue_trading = false;
    if(c.sigue_spot && c.puntuacion_spot==null) cuerpo.sigue_spot = false;
    return apiEnviar('PATCH', `/candidatos/${c.address}`, cuerpo).catch(e=>console.error('fallo desiguiendo', c.address, e));
  }));
  const listaCandidatos = await apiGet('/candidatos');
  candidatos = listaCandidatos;
}

let pollEstadoDescubrimientoEnMarcha = false;
async function pollEstadoDescubrimiento(){
  if(pollEstadoDescubrimientoEnMarcha) return;
  pollEstadoDescubrimientoEnMarcha = true;
  try{
    while(true){
      try{ estadoDescubrimiento = await apiGet('/admin/estado_descubrimiento'); }
      catch(e){ console.error('fallo consultando el estado del descubrimiento', e); break; }
      render();
      if(!estadoDescubrimiento.corriendo) break;
      await new Promise(res => setTimeout(res, 3000));
    }
  }finally{
    pollEstadoDescubrimientoEnMarcha = false;
  }
}

async function iniciar(){
  try{
    // no cambia casi nunca -- se pide una vez al iniciar, no en cada sondeo
    apiGet('/spot_meta').then(m=>{ NOMBRES_MONEDA = m; render(); }).catch(e=>console.error('fallo cargando spot_meta', e));
    await cargarTodo();
    render();
  }catch(e){
    console.error('fallo cargando del backend', e);
    document.getElementById('root').innerHTML = `<div class="estado">No se pudo conectar al backend: ${e.message}</div>`;
    return;
  }
  // por si ya habia un ciclo de descubrimiento corriendo al cargar la
  // pagina (lanzado antes, o desde otra pestaña) -- si no, esta primera
  // consulta devuelve corriendo:false y no vuelve a llamarse
  pollEstadoDescubrimiento();
  // sin WebSocket/onSnapshot aqui -- el backend se refresca solo cada 5 min
  // (ver backend/refresher.py), asi que a esta pagina le basta con volver a
  // pedir los datos de vez en cuando en vez de mantener una conexion viva.
  setInterval(async ()=>{
    try{ await cargarTodo(); render(); }
    catch(e){ console.error('fallo en el sondeo periodico', e); }
  }, INTERVALO_SONDEO_MS);
}
iniciar();
</script>
