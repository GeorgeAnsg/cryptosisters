<title>Corvus 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout: rejilla de tarjetas (grid auto-fill), avatar generado por hash de
   direccion, dos secciones (vetados / especulativos) con tratamiento distinto.
   paleta: blanco/negro + azul de acento, botones y badges tipo pildora */
:root{
  --bg:#e7e9ee; --panel:#ffffff; --panel-dark:#131417; --fg:#131417; --fg-on-dark:#f3f4f6; --fg-muted:#6b7078;
  --border:#e1e3e8; --accent:#2f5bf0; --accent-fg:#ffffff; --accent-weak:#e8edfe;
  --ok:#1a9c5c; --warn:#b4760a; --warn-bg:#fdf1dd; --warn-border:#eecd93; --bad:#d5362a;
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif; --font-body:'Plus Jakarta Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(19,20,23,.04), 0 4px 16px rgba(19,20,23,.06);
  color-scheme: light;
}
/* diseño comprometido con un único aspecto (el de la referencia): claro siempre, sin variante oscura */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:20px 16px;padding-block:28px}
.envoltorio{max-width:1100px;margin:0 auto}
header{margin-bottom:22px}
h1{font-family:var(--font-display);font-weight:800;font-size:1.65rem;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--fg-muted);font-size:.9rem;max-width:620px;line-height:1.5;margin:0}
.cabecera-negra{display:flex;align-items:stretch;gap:0;margin:18px 0 0;background:var(--panel-dark);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;flex-wrap:wrap}
.resumen-item{display:flex;flex-direction:column;gap:3px;padding:16px 24px;justify-content:center}
.resumen-item + .resumen-item{border-left:1px solid rgba(255,255,255,.12)}
.resumen-item .n{font-family:var(--font-display);font-size:1.6rem;font-weight:800;color:var(--fg-on-dark);font-variant-numeric:tabular-nums;transition:transform .25s, color .25s}
.resumen-item .n.resalta{transform:scale(1.35);color:var(--accent)}
.resumen-item .l{font-size:.68rem;color:#9ca0ab;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cn-divisor{width:1px;background:rgba(255,255,255,.12);align-self:stretch;flex:none}
.cn-grafico{padding:14px 24px;min-width:240px;flex:1;display:flex;flex-direction:column;justify-content:center}
.gm-titulo{font-size:.68rem;color:#9ca0ab;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:10px}
.gm-fila{display:flex;align-items:center;gap:8px;font-size:.78rem;margin-bottom:6px}
.gm-fila:last-child{margin-bottom:0}
.gm-moneda{width:62px;flex:none;color:var(--fg-on-dark);font-family:var(--font-mono);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-barra-fondo{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.gm-barra{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.gm-n{width:18px;flex:none;text-align:right;color:#9ca0ab;font-family:var(--font-mono);font-size:.72rem}

.page-tabs{display:flex;gap:8px;margin-top:18px}
.btn-campana{margin-left:auto;position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--panel);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-campana .alerta-tab{top:6px;right:6px}
.page-tab{font:inherit;font-size:.86rem;font-weight:700;padding:9px 18px;border-radius:99px;border:1px solid var(--border);background:var(--panel);color:var(--fg-muted);cursor:pointer}
.filtro-actividad{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:14px}
.filtro-pills{display:flex;gap:6px}
.filtro-pill{font:inherit;font-size:.76rem;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--panel);color:var(--fg-muted);cursor:pointer}
.filtro-pill.activo{background:#000;color:#fff;border-color:#000}
.page-tab.activo{background:var(--panel-dark);color:var(--fg-on-dark);border-color:var(--panel-dark)}
.page-panel.oculto{display:none}

.sub-tab{font:inherit;font-size:.8rem;font-weight:700;padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:var(--panel);color:var(--fg-muted);cursor:pointer}
.sub-tab.activo{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sub-panel.oculto{display:none}
table.ops{background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.pf-trader{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--font-display);font-weight:700}
.pf-trader .avatar{width:26px;height:26px;font-size:.74rem}

h2{font-family:var(--font-display);font-weight:800;font-size:1.1rem;margin:32px 0 4px;display:flex;align-items:baseline;gap:10px;letter-spacing:-.01em}
h2 .n{font-family:var(--font-mono);font-size:.74rem;color:var(--fg-muted);font-weight:500}
.seccion-sub{font-size:.8rem;color:var(--fg-muted);margin:0 0 16px;max-width:640px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

.tarjeta{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:opacity .15s, border-color .15s}
.tarjeta.nuevo-descubrimiento{border:2px solid #3b6fe0;box-shadow:0 0 0 3px rgba(59,111,224,.15)}
.tarjeta.no-sigue{opacity:.5}
.tarjeta.especulativo{border-color:var(--warn-border)}

.cabecera-tarjeta{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:#fff}
.avatar-puntuacion{width:50px;height:50px;flex-direction:column;line-height:1;gap:1px}
.avatar-puntuacion .n{font-size:1.05rem;font-weight:800}
.avatar-puntuacion .d{font-size:.5rem;font-weight:600;opacity:.75}
.id-wrap{flex:1;min-width:0}
.addr{font-family:var(--font-mono);font-size:.8rem;color:var(--fg);display:block}
.badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.64rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.b-posicional,.b-activo{background:var(--accent-weak);color:var(--accent)}
.b-muy_activo{background:var(--warn-bg);color:var(--warn)}
.b-conservador{background:rgba(26,156,92,.12);color:var(--ok)}
.b-moderado{background:var(--warn-bg);color:var(--warn)}
.b-agresivo{background:rgba(213,54,42,.1);color:var(--bad)}

.sw{position:absolute;top:16px;right:16px;width:42px;height:25px;border-radius:99px;background:#8a8f99;border:none;cursor:pointer;transition:background .15s;z-index:2}
.btn-borrar-candidato{position:absolute;top:18px;right:66px;width:21px;height:21px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--fg-muted);font-size:.7rem;line-height:1;cursor:pointer;z-index:2}
.btn-borrar-candidato:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.sw.on{background:#000}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on::after{transform:translateX(17px)}
.sw:disabled{cursor:wait;opacity:.6}

.tarjeta{cursor:pointer}
.tarjeta:hover{border-color:var(--fg-muted)}

.modal-fondo{position:fixed;inset:0;background:rgba(19,20,23,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:var(--bg);border-radius:20px;max-width:1020px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-cabecera{display:flex;align-items:center;gap:12px;padding:22px 22px 14px;flex:none}
.modal-tabs{display:flex;gap:6px;padding:0 22px 14px;flex:none}
.modal-tab{font:inherit;font-size:.82rem;font-weight:700;padding:7px 16px;border-radius:99px;border:1px solid var(--border);background:var(--panel);color:var(--fg-muted);cursor:pointer}
.modal-tab.activo{background:var(--panel-dark);color:var(--fg-on-dark);border-color:var(--panel-dark)}
table.ops.oculto,.panel.oculto{display:none}
.panel-subtitulo{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);margin:20px 0 12px;font-weight:700}
.panel-subtitulo:first-child{margin-top:0}
.modal-cerrar{margin-left:auto;background:none;border:none;font-size:1.3rem;color:var(--fg-muted);cursor:pointer;line-height:1;padding:4px}
.modal-lista{overflow:auto;padding:0 22px 22px}
table.ops{border-collapse:collapse;width:100%;font-size:.78rem}
table.ops th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);font-weight:700;padding:20px;border-bottom:1px solid var(--border);cursor:help}
table.ops td{padding:16px 20px;border-bottom:1px solid var(--border);font-family:var(--font-mono);white-space:nowrap}
table.ops tr:last-child td{border-bottom:none}
.op-lado{font-weight:700;padding:3px 9px;border-radius:99px;font-size:.66rem;text-transform:uppercase;letter-spacing:.02em;cursor:help}
.op-lado.long{background:#e3ecfd;color:#2f5bf0}
.op-lado.short{background:#fde9e7;color:#c24a3b}
.op-lado.spot{background:var(--border);color:var(--fg-muted)}
.op-pnl.pos{color:var(--ok);font-weight:700}
.op-pnl.neg{color:var(--bad);font-weight:700}
tr.op-cabecera td{background:var(--accent-weak);font-weight:700;padding:20px}
tr.op-hijo td{padding-left:26px;color:var(--fg-muted);font-weight:400}
tr.op-hijo.oculto{display:none}
.op-estado{font-size:.64rem;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:99px;font-weight:700}
.op-estado.abierta{background:var(--accent-weak);color:var(--accent)}
.op-estado.cerrada{background:var(--border);color:var(--fg-muted)}
.punto-mov{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--border)}
.punto-mov.nuevo{background:var(--ok)}
.op-flecha{cursor:pointer;display:inline-block;width:12px;color:var(--fg-muted);user-select:none}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:14px 0;padding-top:14px;border-top:1px solid var(--border)}
.stat .l{font-size:.62rem;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:600}
.stat .v{font-family:var(--font-mono);font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums}

.monedas{font-size:.78rem;color:var(--fg-muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis}
.etiqueta-especulativo{font-size:.8rem;color:var(--warn);font-weight:600;margin-bottom:8px;line-height:1.4}

.estado{font-size:.84rem;color:var(--fg-muted);text-align:center;padding:40px}
.btn-abrir,.btn-cerrar,.btn-añadir,.btn-reducir{font:inherit;font-size:.74rem;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--panel);color:var(--fg-muted);cursor:pointer}
.btn-cerrar,.btn-añadir,.btn-reducir{width:26px;height:26px;padding:0;font-size:.95rem;line-height:1}
.btn-abrir:hover,.btn-cerrar:hover,.btn-añadir:hover,.btn-reducir:hover{background:#000;color:#fff;border-color:#000}
.seccion-titulo{font-family:var(--font-display);font-weight:800;font-size:.95rem;margin:0 2px 10px}
.gb-leyenda{font-size:.76rem;color:var(--fg-muted);margin:-4px 2px 12px}
.grafico-barras{background:#000;color:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:18px}
.consenso-caja{background:#000;color:#fff;border-radius:16px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:22px;display:flex;flex-direction:column;gap:16px}
.consenso-fila{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.consenso-fila:not(:last-child){padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.15)}
.consenso-fila .pf-trader{color:#fff}
.gb-fila{display:grid;grid-template-columns:110px 1fr 130px;align-items:center;gap:8px;font-size:.8rem;padding:5px 0;cursor:default}
.gb-etiqueta{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-pista{display:flex;height:14px;position:relative}
.gb-pista::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.2)}
.gb-mitad{width:50%;display:flex}
.gb-izq{justify-content:flex-end}
.gb-barra{height:100%;border-radius:3px;background:var(--fg-muted)}
.gb-barra.pos{background:var(--ok)}
.gb-barra.neg{background:var(--bad)}
.gb-valor{text-align:right;font-weight:700;font-family:var(--font-mono)}
.gb-valor.pos{color:var(--ok)}
.gb-valor.neg{color:var(--bad)}
.stat-caja{background:var(--panel);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat-caja .v{font-size:1.25rem}
.page-tab{position:relative}
.page-tab .alerta-tab{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
</style>

<div class="envoltorio">
<header>
  <h1>Corvus 5</h1>
  <div class="cabecera-negra">
    <div class="resumen-item"><span class="n" id="n-siguiendo">—</span><span class="l">Siguiendo</span></div>
    <div class="resumen-item"><span class="n" id="n-total">—</span><span class="l">Total</span></div>
    <div class="resumen-item"><span class="n" id="n-pnl-vivo">—</span><span class="l">PnL en vivo (tuyo)</span></div>
    <div class="resumen-item"><span class="n" id="n-winrate-propio">—</span><span class="l">Win rate (tuyo)</span></div>
    <div class="cn-divisor"></div>
    <div id="grafico-monedas" class="cn-grafico"></div>
  </div>
  <div class="page-tabs">
    <button class="page-tab activo" data-pagina="mias">Mis posiciones</button>
    <button class="page-tab" data-pagina="posiciones">Posiciones de seguimiento</button>
    <button class="page-tab" data-pagina="seguimiento">Traders</button>
    <button class="page-tab" data-pagina="stats">Estadísticas</button>
    <button id="btn-notificaciones" class="btn-campana" title="Notificaciones">🔔<span class="alerta-tab" id="punto-notificaciones" style="display:none"></span></button>
  </div>
</header>

<div id="root"><div class="estado">Cargando...</div></div>
</div>

<script>
let candidatos = [];
let alertas = {};
let misPosiciones = {};
let notificaciones = [];
let expandidos = new Set(); // que flechas estan desplegadas -- sobrevive al sondeo periodico (cargarTodo+render cada 30s)

// backend propio (ver carpeta backend/) -- mismo origen que esta pagina,
// ruta relativa. El backend sustituye esto por la API_KEY real al servir
// la pagina (ver main.py, pagina_principal): la pagina es solo tan privada
// como lo sea la URL -- no la compartas en abierto.
const API_BASE = '';
const API_KEY = 'PON_AQUI_TU_API_KEY';

async function apiGet(ruta){
  const r = await fetch(API_BASE + ruta, {headers:{'X-API-Key':API_KEY}});
  if(!r.ok) throw new Error(`${ruta} -> ${r.status}`);
  return r.json();
}
async function apiEnviar(metodo, ruta, cuerpo){
  const r = await fetch(API_BASE + ruta, {
    method: metodo,
    headers: {'Content-Type':'application/json', 'X-API-Key':API_KEY},
    body: JSON.stringify(cuerpo),
  });
  if(!r.ok) throw new Error(`${ruta} -> ${r.status}`);
  return r.json();
}

// cuando viste la pagina la ultima vez -- se usa para marcar "nuevo" lo que
// se ha movido despues de esa visita. Se lee una vez al cargar (asi los
// badges no van desapareciendo mientras sigues mirando esta misma sesion) y
// se guarda ya el momento actual para la proxima vez que entres.
let ultimaVisitaAnterior = null;
try{
  const guardada = localStorage.getItem('segTraders_ultimaVisita');
  ultimaVisitaAnterior = guardada ? parseInt(guardada, 10) : null;
  localStorage.setItem('segTraders_ultimaVisita', String(Date.now()));
}catch(e){}

const UNA_HORA_MS = 60*60*1000;
// "es nuevo" si es posterior a tu ultima visita O si simplemente ha pasado
// menos de una hora desde que ocurrio -- si no, recargar la pagina (que
// actualiza "ultima visita" al instante) podia hacer desaparecer un punto
// que acababa de aparecer hace un minuto.
function esReciente(ts){
  if(!ts) return false;
  if(ultimaVisitaAnterior && ts > ultimaVisitaAnterior) return true;
  return (Date.now() - ts) < UNA_HORA_MS;
}

function hashAddr(addr){
  let h = 0;
  for(let i=0;i<addr.length;i++){ h = (h*31 + addr.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function colorFor(addr){
  const h = hashAddr(addr) % 360;
  return `hsl(${h} 58% 42%)`;
}

const PLANTAS = ['Roble','Sauce','Bambú','Olivo','Ciprés','Abedul','Acacia','Laurel','Jazmín','Lavanda',
  'Romero','Tomillo','Helecho','Magnolia','Cerezo','Pino','Cedro','Haya','Álamo','Arce',
  'Eucalipto','Hiedra','Loto','Girasol','Orquídea','Bonsái','Palmera','Secuoya','Baobab','Mimosa',
  'Nogal','Fresno','Tilo','Azalea','Camelia','Begonia','Hortensia','Tulipán','Narciso','Peonía'];
const plantaPorAddr = {};
function asignarPlantas(lista){
  const usadas = new Set(Object.values(plantaPorAddr));
  const ordenado = [...lista].sort((a,b)=> a.address.localeCompare(b.address));
  for(const c of ordenado){
    if(plantaPorAddr[c.address]) continue;
    let i = hashAddr(c.address) % PLANTAS.length;
    let intentos = 0;
    while(usadas.has(PLANTAS[i]) && intentos < PLANTAS.length){ i = (i+1) % PLANTAS.length; intentos++; }
    plantaPorAddr[c.address] = PLANTAS[i];
    usadas.add(PLANTAS[i]);
  }
}
function plantaFor(addr){
  return plantaPorAddr[addr] || addr.slice(0,6);
}

// se rellena de verdad en cargarTodo() desde /spot_meta (la lista completa y
// en vivo que ya sabe el backend) -- este fallback fijo es solo por si esa
// llamada falla y hay que seguir mostrando algo antes de que cargue
let NOMBRES_MONEDA = {'@107':'HYPE','@142':'UBTC','@151':'UETH','@156':'USOL'};
function nombreMonedaBase(coin){
  return NOMBRES_MONEDA[coin] || coin;
}
// el backend formatea la fecha en UTC (o.time) -- aqui se recalcula en la
// hora local del navegador a partir del timestamp crudo (o.ts/ultima.ts)
function fechaLocal(ts){
  if(!ts) return 'sin fecha reciente';
  const d = new Date(ts);
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${String(d.getDate()).padStart(2,'0')}-${meses[d.getMonth()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function nombreMoneda(coin){
  return NOMBRES_MONEDA[coin] ? etiquetaMoneda(NOMBRES_MONEDA[coin]) : coin;
}
// UBTC/UETH/USOL en spot son el mismo activo que BTC/ETH/SOL en trading
// (bitcoin/eth/sol de verdad, tokenizado via Unit) -- se muestran igual
// para no dar la impresion de que son monedas distintas. nombreMonedaBase()
// SIGUE devolviendo el nombre interno (UBTC) para no romper el matching
// contra holdings_spot; esto es solo para lo que ve el usuario.
const ALIAS_MONEDA = {UBTC:'BTC', UETH:'ETH', USOL:'SOL'};
function etiquetaMoneda(nombre){
  return ALIAS_MONEDA[nombre] || nombre;
}

function tarjeta(c, filtroActividad){
  const addrCorta = c.address.slice(0,8)+'…'+c.address.slice(-4);
  const mostrarSpot = filtroActividad === 'spot';
  const puntuacionMostrada = mostrarSpot ? c.puntuacion_spot : c.puntuacion;
  const planta = plantaFor(c.address);
  const esEspeculativo = c.categoria === 'especulativo';
  const avatar = puntuacionMostrada!=null
    ? `<div class="avatar avatar-puntuacion" style="background:${colorFor(c.address)}"><span class="n">${puntuacionMostrada}</span><span class="d">100</span></div>`
    : `<div class="avatar" style="background:${colorFor(c.address)}">${planta[0]}</div>`;
  // que faceta controla el interruptor depende de en que pestaña estas
  // viendo la tarjeta: en "Solo trading"/"Solo spot" controla esa faceta
  // sola; en "Trading + Spot" (o en las especulativas, que no tienen
  // facetas) controla las dos a la vez
  const facetaSwitch = filtroActividad==='trading' ? 'trading' : (filtroActividad==='spot' ? 'spot' : 'ambos');
  const sigueFacetaSwitch = facetaSwitch==='trading' ? c.sigue_trading : (facetaSwitch==='spot' ? c.sigue_spot : c.siguiendo);
  const switchHtml = `<button class="sw ${sigueFacetaSwitch?'on':''}" data-addr="${c.address}" data-on="${sigueFacetaSwitch?'1':'0'}" data-faceta="${facetaSwitch}" aria-label="Seguir a ${planta} (${facetaSwitch})"></button>`;
  const borrarHtml = `<button class="btn-borrar-candidato" data-addr="${c.address}" data-planta="${planta}" title="Quitar de la lista del todo">✕</button>`;
  const esNuevoDescubrimiento = esReciente(c.descubierto_ts);

  if(esEspeculativo){
    return `
      <div class="tarjeta especulativo ${sigueFacetaSwitch?'':'no-sigue'} ${esNuevoDescubrimiento?'nuevo-descubrimiento':''}" data-addr="${c.address}" data-abre-modal="1">
        ${switchHtml}${borrarHtml}
        <div class="cabecera-tarjeta">
          ${avatar}
          <div class="id-wrap">
            <span class="addr">${planta} <span style="color:var(--fg-muted);font-size:.7rem">(${addrCorta})</span></span>
            <div class="badges"><span class="badge" style="background:var(--warn-bg);color:var(--warn)">especulativo</span></div>
          </div>
        </div>
        <div class="etiqueta-especulativo">${c.etiqueta||''}</div>
        <div class="monedas">${c.monedas||''}</div>
      </div>`;
  }

  const drawdownMostrado = mostrarSpot ? c.drawdown_spot : c.drawdown;
  const retornoMostrado = mostrarSpot ? c.retorno_pct_spot : c.retorno_pct;
  const winRateMostrado = mostrarSpot ? c.win_rate_spot : c.win_rate;
  return `
    <div class="tarjeta ${sigueFacetaSwitch?'':'no-sigue'} ${esNuevoDescubrimiento?'nuevo-descubrimiento':''}" data-addr="${c.address}" data-abre-modal="1">
      ${switchHtml}${borrarHtml}
      <div class="cabecera-tarjeta">
        ${avatar}
        <div class="id-wrap">
          <span class="addr">${planta} <span style="color:var(--fg-muted);font-size:.7rem">(${addrCorta})</span></span>
          <div class="badges">
            <span class="badge b-${c.estilo}">${c.estilo.replace('_',' ')}</span>
            <span class="badge b-${c.riesgo}">${c.riesgo}</span>
          </div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="l">Antigüedad</div><div class="v">${c.antiguedad}d</div></div>
        <div class="stat"><div class="l">Drawdown</div><div class="v">${drawdownMostrado!=null?(drawdownMostrado*100).toFixed(0)+'%':'—'}</div></div>
        <div class="stat"><div class="l">Cuenta</div><div class="v">$${Math.round(c.cuenta).toLocaleString('es-ES')}</div></div>
        <div class="stat"><div class="l">Win rate</div><div class="v">${winRateMostrado!=null?(winRateMostrado*100).toFixed(0)+'%':'—'}</div></div>
        <div class="stat"><div class="l">Retorno backtest</div><div class="v" style="color:${retornoMostrado>0?'var(--ok)':retornoMostrado<0?'var(--bad)':'inherit'}">${retornoMostrado!=null?retornoMostrado.toFixed(1)+'%':'—'}</div></div>
        <div class="stat"><div class="l">Profit factor</div><div class="v">${c.profit_factor!=null?c.profit_factor.toFixed(2):(c.profit_factor===null&&c.retorno_pct!=null?'∞':'—')}</div></div>
      </div>
      <div class="monedas">${c.monedas||''}</div>
    </div>`;
}

let paginaActiva = 'mias';
let filtroActividad = 'trading';
let ordenAsc = false;
let subPestañaPosiciones = 'trading';

function bloqueDePosicion(c, lado, coinBase){
  const ops = agruparEpisodios(c.operaciones_recientes || []);
  const bloques = construirBloques(ops);
  // bloques viene de mas reciente a mas antiguo: el primero que encaje con
  // esta clave es el mas reciente -- es el que corresponde a la posicion
  // que sigue abierta ahora (misma logica que en el modal).
  return bloques.find(x => x.lado === lado && (lado === 'Spot' ? nombreMonedaBase(x.coin) === coinBase : x.coin === coinBase)) || null;
}

function marcarCierres(filas){
  // filas tiene que venir en orden cronologico (mas antigua primero). Un
  // "Cierra" solo es un cierre DE VERDAD si, tras restarle su tamaño a lo
  // que quedaba, no queda nada (o casi); si queda algo, es una reduccion
  // parcial y la posicion sigue viva. Sin esto, "Reduce/cierra" no decia
  // cual de las dos cosas pasaba realmente.
  let restante = 0;
  return filas.map((o,i)=>{
    restante += (o.accion === 'Abre' ? o.sz : -o.sz);
    const cierraDelTodo = o.accion === 'Cierra' && Math.abs(restante) < 0.00001;
    return {...o, cierraDelTodo, esInicio: i===0};
  });
}

function filaMovimientoTrading(o, filaId, abierta){
  // columnas alineadas con la cabecera de la tabla padre: Fecha, Dirección,
  // Moneda, $ invertido, % de su cartera, Entrada, Trader, Resultado, (Abrir)
  const pnlClase = o.closedPnl > 0 ? 'pos' : (o.closedPnl < 0 ? 'neg' : '');
  const pnlTexto = o.closedPnl ? `${o.closedPnl>0?'+':''}$${o.closedPnl.toFixed(2)}` : '—';
  const verbo = (o.esInicio && o.accion==='Abre') ? 'Abre (inicio)' : (o.accion === 'Abre' ? 'Añade' : (o.cierraDelTodo ? 'Cierra' : 'Reduce'));
  return `<tr class="op-hijo ${abierta?'':'oculto'}" data-hijo-de="${filaId}">
    <td>${fechaLocal(o.ts)}</td>
    <td>${verbo}</td>
    <td></td>
    <td>$${o.notional.toLocaleString('es-ES',{maximumFractionDigits:0})}</td>
    <td>—</td>
    <td>$${o.px}</td>
    <td></td>
    <td class="op-pnl ${pnlClase}">${pnlTexto}</td>
    <td></td>
  </tr>`;
}

function filaMovimientoSpot(o, filaId, abierta){
  // columnas alineadas con la cabecera: Fecha, Moneda, $ invertido, % de su
  // cartera, Trader, Valor actual, Resultado, (Abrir)
  const pnlClase = o.closedPnl > 0 ? 'pos' : (o.closedPnl < 0 ? 'neg' : '');
  const pnlTexto = o.closedPnl ? `${o.closedPnl>0?'+':''}$${o.closedPnl.toFixed(2)}` : '—';
  const esEntrada = o.accion === 'Abre';
  const verbo = (o.esInicio && esEntrada) ? 'Compra (inicio)' : (esEntrada ? 'Compra' : (o.cierraDelTodo ? 'Cierra' : 'Vende'));
  return `<tr class="op-hijo ${abierta?'':'oculto'}" data-hijo-de="${filaId}">
    <td>${fechaLocal(o.ts)}</td>
    <td>${verbo}</td>
    <td>${esEntrada?'+':'-'}$${o.notional.toLocaleString('es-ES',{maximumFractionDigits:0})}</td>
    <td>—</td>
    <td></td>
    <td>—</td>
    <td class="op-pnl ${pnlClase}">${pnlTexto}</td>
    <td></td>
  </tr>`;
}

function filaPlanta(c, faceta){
  const planta = plantaFor(c.address);
  return `<span class="pf-trader" data-addr="${c.address}" data-faceta="${faceta||''}"><span class="avatar" style="background:${colorFor(c.address)}">${planta[0]}</span>${planta}</span>`;
}

function renderPaginaSeguimiento(){
  const filtros = [['trading','Trading'],['spot','Spot']];
  const filtrosHtml = `<div class="filtro-actividad">
    <div class="filtro-pills">${filtros.map(([v,l])=>
      `<button class="filtro-pill ${filtroActividad===v?'activo':''}" data-filtro="${v}">${l}</button>`).join('')}</div>
    <button class="filtro-pill" data-orden="1" title="Cambiar orden">Puntuación ${ordenAsc?'▲':'▼'}</button>
    <button class="filtro-pill" data-forzar-descubrimiento="1" title="Recalcula ya a todo el mundo no seguido, en vez de esperar al ciclo semanal">↻ Recalcular ahora</button>
  </div>`;

  // solo trading o solo spot -- nunca mezclados en la misma vista; las
  // especulativas (sin facetas) se ven en el filtro de trading por defecto
  let lista = candidatos;
  if(filtroActividad==='trading') lista = lista.filter(c=>c.categoria==='especulativo' || c.puntuacion!=null);
  if(filtroActividad==='spot') lista = lista.filter(c=>c.puntuacion_spot!=null);

  // para "ambos" se ordena tambien por la puntuacion de trading -- es la
  // misma que se muestra en el avatar de la tarjeta en esa vista
  const puntuacionDe = c => filtroActividad==='spot' ? c.puntuacion_spot : c.puntuacion;
  const dir = ordenAsc ? 1 : -1;
  const todos = [...lista].sort((a,b)=>{
    if((a.categoria==='especulativo') !== (b.categoria==='especulativo')) return a.categoria==='especulativo' ? 1 : -1;
    return dir * ((puntuacionDe(a)??-1) - (puntuacionDe(b)??-1));
  });
  const grid = todos.length ? `<div class="grid">${todos.map(c=>tarjeta(c, filtroActividad)).join('')}</div>`
    : '<div class="estado">Nadie tiene puntuación en esta categoría todavía.</div>';
  return filtrosHtml + grid;
}

function renderPaginaPosiciones(){
  // trading y spot se siguen por separado -- cada tabla solo mira a quien
  // tiene SU faceta seguida, no "siguiendo" en general (ver tarjeta())
  const siguiendoTrading = candidatos.filter(c=>c.sigue_trading);
  const siguiendoSpot = candidatos.filter(c=>c.sigue_spot);
  if(!siguiendoTrading.length && !siguiendoSpot.length) return '<div class="estado">No sigues a nadie todavía — actívalo en la pestaña "Seguimiento".</div>';

  // el backtest diario (ver refresher.ciclo_backtest_diario) es lo unico que
  // actualiza los "bloques" (operaciones_recientes), asi que su fecha puede
  // tener hasta un dia de retraso -- el ciclo de 5 min SI sabe el momento
  // exacto en que detecto el ultimo cambio de tamaño (tabla 'alertas'), asi
  // que esa fecha manda cuando es mas reciente que la del bloque
  const masReciente = (tsBloque, idAlerta)=>{
    const tsAlerta = alertas[idAlerta]?.detectado;
    if(tsAlerta && (!tsBloque || tsAlerta > tsBloque)) return tsAlerta;
    return tsBloque || null;
  };

  const trading = [], spot = [];
  for(const c of siguiendoTrading){
    for(const p of (c.posicion_actual||[])){
      const b = bloqueDePosicion(c, p.lado, p.coin);
      const ultima = b ? b.filas[b.filas.length-1] : null;
      const ts = masReciente(ultima?.ts, `${c.address}_trading_${p.coin}_${p.lado}`);
      trading.push({c, bloque:b, lado:p.lado, coin:p.coin, tamaño:p['tamaño'], precio:p.entryPx, pnl:p.pnlNoRealizado, stopLoss:p.stopLoss, takeProfit:p.takeProfit, ts, fecha:ts?fechaLocal(ts):'sin fecha reciente'});
    }
  }
  // una venta total (o una reduccion tan grande que deja el resto en polvo)
  // hace que holdings_spot_de() deje de incluir la moneda del todo -- sin
  // esto, esa venta desaparecia de esta tabla sin dejar rastro aunque la
  // alerta de Telegram si hubiera avisado: se muestra igual mientras siga
  // "reciente", leyendo lo que ya sabe la tabla alertas (tamaño=0).
  const VENTANA_SPOT_CERRADO_RECIENTE_MS = 72 * 3600 * 1000;
  for(const c of siguiendoSpot){
    for(const h of (c.holdings_spot||[])){
      const b = bloqueDePosicion(c, 'Spot', h.coin);
      const ultima = b ? b.filas[b.filas.length-1] : null;
      const ts = masReciente(ultima?.ts, `${c.address}_spot_${h.coin}`);
      spot.push({c, bloque:b, coin:h.coin, tamaño:h['tamaño'], coste:h.costeBase, valor:h.valorActual, pnl:h.pnlNoRealizado, ts, fecha:ts?fechaLocal(ts):'sin fecha reciente'});
    }
    for(const al of Object.values(alertas)){
      if(al.tipo!=='spot' || al.addr!==c.address || al.tamaño!==0 || al.detectado==null) continue;
      if(Date.now()-al.detectado > VENTANA_SPOT_CERRADO_RECIENTE_MS) continue;
      if((c.holdings_spot||[]).some(h=>h.coin===al.coin)) continue; // se ha vuelto a comprar, ya tiene su fila arriba
      const b = bloqueDePosicion(c, 'Spot', al.coin);
      const valorVendido = (al.tamaño_antes!=null && al.precio!=null) ? al.tamaño_antes*al.precio : null;
      spot.push({c, bloque:b, coin:al.coin, tamaño:0, coste:null, valor:0, pnl:null, ts:al.detectado, fecha:fechaLocal(al.detectado), cerrado:true, valorVendido});
    }
  }
  const porFecha = (a,b)=> (b.ts??-1) - (a.ts??-1);
  trading.sort(porFecha); spot.sort(porFecha);

  if(!trading.length && !spot.length) return '<div class="estado">Los que sigues no tienen ninguna posición abierta ahora mismo.</div>';

  const puntoMov = (ts)=>{
    const esNuevo = esReciente(ts);
    return `<span class="punto-mov ${esNuevo?'nuevo':''}" title="${esNuevo?'Movimiento posterior a tu última visita':'Ya lo habías visto'}"></span>`;
  };

  const pctCartera = (invertido, cuenta)=> (invertido!=null && cuenta) ? `${(invertido/cuenta*100).toFixed(1)}%` : '—';

  const botonAbrir = (addr, tipo, coin, lado, motivoNoAbrir, tamañoTrader)=>{
    const id = `mp_${addr}_${tipo}_${coin}_${lado||'spot'}`;
    const yaAbierta = Object.values(misPosiciones).some(m=>m.estado==='abierta' && m.addr===addr && m.tipo===tipo && m.coin===coin && (m.lado||null)===(lado||null));
    if(yaAbierta) return `<span style="color:var(--fg-muted);font-size:.74rem">ya abierta</span>`;
    if(motivoNoAbrir) return `<span style="color:var(--fg-muted);font-size:.68rem" title="${motivoNoAbrir}">—</span>`;
    return `<button class="btn-abrir" data-id="${id}" data-addr="${addr}" data-tipo="${tipo}" data-coin="${coin}" data-lado="${lado||''}" data-tamano-trader="${tamañoTrader??''}">Abrir</button>`;
  };

  const UMBRAL_DIAS_ABRIR = 3;
  const motivoNoAbrirTrading = (it)=>{
    const primera = it.bloque && it.bloque.filas.length ? it.bloque.filas[0] : null;
    const incompleta = !it.bloque || it.bloque.truncada
      || Math.abs(Math.abs(it.bloque.neto) - it.tamaño) > Math.max(1e-6, it.tamaño*0.001);
    if(incompleta) return 'No tenemos el inicio de esta posición (se abrió antes de lo que vemos de este trader) — no tiene sentido copiarla ya empezada.';
    const diasDesdeInicio = (Date.now() - primera.ts) / 86400000;
    if(diasDesdeInicio > UMBRAL_DIAS_ABRIR) return `Posición abierta hace más de ${UMBRAL_DIAS_ABRIR} días — ya ha pasado demasiado tiempo para copiarla al precio de hoy.`;
    return null;
  };

  // si el ciclo de 5 min acaba de ver un añadido que el backtest diario
  // todavia no tiene como fill de verdad (ver masReciente arriba), se
  // construye un fill "sintetico" con lo que SI sabemos (antes/ahora de la
  // tabla alertas) para que la fila sea expandible igualmente -- si no,
  // "acaba de añadir" no se podia ver desglosado hasta el siguiente backtest
  const movimientoSintetico = (clave, ts, coin, precio)=>{
    const al = alertas[clave];
    if(!al || al.tamaño_antes == null || al.detectado !== ts) return null;
    const delta = al.tamaño - al.tamaño_antes;
    if(delta <= 0) return null; // una reduccion no es "ha añadido"
    return {ts, accion:'Abre', esInicio:false, cierraDelTodo:false, sz:+delta.toPrecision(8), notional:Math.round(delta*precio), px:precio, nFills:1, closedPnl:0, coin};
  };

  const filasTrading = trading.length ? trading.map(it=>{
    const lado = it.lado.toLowerCase();
    const invertido = it.tamaño * it.precio;
    const pnlClase = it.pnl > 0 ? 'pos' : (it.pnl < 0 ? 'neg' : '');
    const pnl = it.pnl!=null ? `<span class="op-pnl ${pnlClase}">${it.pnl>0?'+':''}$${it.pnl.toLocaleString('es-ES',{maximumFractionDigits:0})}</span>` : '<span style="color:var(--fg-muted)">sin dato</span>';
    const claveAlerta = `${it.c.address}_trading_${it.coin}_${it.lado}`;
    const sintetico = movimientoSintetico(claveAlerta, it.ts, it.coin, it.precio);
    const filasReales = it.bloque ? it.bloque.filas : [];
    const tieneDetalle = filasReales.length > 1 || (filasReales.length >= 1 && sintetico);
    const filaId = `t_${it.c.address}_${it.coin}_${it.lado}`;
    const abierta = expandidos.has(filaId);
    const flecha = tieneDetalle ? `<span class="op-flecha" data-bloque="${filaId}">${abierta?'▾':'▸'}</span>` : '';
    const cabecera = `<tr>
      <td>${puntoMov(it.ts)}${it.fecha}</td>
      <td>${flecha}<span class="op-lado ${lado}">${it.lado}</span></td>
      <td>${it.coin}</td>
      <td>$${invertido.toLocaleString('es-ES',{maximumFractionDigits:0})}</td>
      <td>${pctCartera(invertido, it.c.cuenta)}</td>
      <td>$${it.precio}${(it.takeProfit!=null||it.stopLoss!=null)?`<br><span style="font-size:.68rem;color:var(--fg-muted)">${it.takeProfit!=null?`TP $${it.takeProfit}`:''}${it.takeProfit!=null&&it.stopLoss!=null?' · ':''}${it.stopLoss!=null?`SL $${it.stopLoss}`:''}</span>`:''}</td>
      <td>${filaPlanta(it.c, 'trading')}</td>
      <td>${pnl}</td>
      <td>${botonAbrir(it.c.address, 'trading', it.coin, it.lado, motivoNoAbrirTrading(it), it.tamaño)}</td>
    </tr>`;
    const hijosReales = filasReales.length > 1 ? marcarCierres(filasReales).reverse().map(o=>filaMovimientoTrading(o, filaId, abierta)) : [];
    const hijos = sintetico ? [filaMovimientoTrading(sintetico, filaId, abierta), ...hijosReales] : hijosReales;
    return cabecera + hijos.join('');
  }).join('') : '<tr><td colspan="9" class="estado">Nadie que sigas tiene trading abierto ahora mismo.</td></tr>';

  const filasSpot = spot.length ? spot.map(it=>{
    const coste = it.cerrado
      ? (it.valorVendido!=null ? `-$${it.valorVendido.toLocaleString('es-ES',{maximumFractionDigits:0})}` : `<span style="color:var(--fg-muted)">sin dato</span>`)
      : (it.coste!=null ? `$${it.coste.toLocaleString('es-ES',{maximumFractionDigits:0})}` : `<span style="color:var(--fg-muted)">sin dato</span>`);
    const valor = it.cerrado ? '—' : (it.valor!=null ? `$${it.valor.toLocaleString('es-ES',{maximumFractionDigits:0})}` : '—');
    const pnlClase = it.pnl > 0 ? 'pos' : (it.pnl < 0 ? 'neg' : '');
    const pnl = it.pnl!=null ? `<span class="op-pnl ${pnlClase}">${it.pnl>0?'+':''}$${it.pnl.toLocaleString('es-ES',{maximumFractionDigits:0})}</span>` : '—';
    const claveAlerta = `${it.c.address}_spot_${it.coin}`;
    const precioAprox = it.coste!=null && it.tamaño ? it.coste/it.tamaño : (it.valor!=null && it.tamaño ? it.valor/it.tamaño : 0);
    const sintetico = movimientoSintetico(claveAlerta, it.ts, it.coin, precioAprox);
    const filasReales = it.bloque ? it.bloque.filas : [];
    const tieneDetalle = filasReales.length > 1 || (filasReales.length >= 1 && sintetico);
    const filaId = `s_${it.c.address}_${it.coin}`;
    const abierta = expandidos.has(filaId);
    const flecha = tieneDetalle ? `<span class="op-flecha" data-bloque="${filaId}">${abierta?'▾':'▸'}</span>` : '';
    const cabecera = `<tr>
      <td>${puntoMov(it.ts)}${it.fecha}</td>
      <td>${flecha}${etiquetaMoneda(it.coin)}${it.cerrado?' <span class="op-estado cerrada">vendida</span>':''}</td>
      <td>${coste}</td>
      <td>${pctCartera(it.coste, it.c.cuenta)}</td>
      <td>${filaPlanta(it.c, 'spot')}</td>
      <td>${valor}</td>
      <td>${pnl}</td>
      <td>${it.cerrado ? '' : botonAbrir(it.c.address, 'spot', it.coin, null, null, it.tamaño)}</td>
    </tr>`;
    const hijosReales = filasReales.length > 1 ? marcarCierres(filasReales).reverse().map(o=>filaMovimientoSpot(o, filaId, abierta)) : [];
    const hijos = sintetico ? [filaMovimientoSpot(sintetico, filaId, abierta), ...hijosReales] : hijosReales;
    return cabecera + hijos.join('');
  }).join('') : '<tr><td colspan="8" class="estado">Nadie que sigas tiene nada en spot ahora mismo.</td></tr>';

  // consenso reciente: varios traders independientes han hecho lo MISMO
  // (abrir/añadir, o cerrar del todo) en la misma moneda+direccion en poco
  // tiempo -- mas señal que uno solo, y mas interesante que "quien tiene
  // esto abierto desde hace meses". Dos grupos separados porque "3 estan
  // entrando" y "3 estan saliendo" son señales opuestas, no se mezclan.
  const VENTANA_CONSENSO_MS = 72 * 3600 * 1000;
  const ahoraMs = Date.now();
  const agrupar = (items, extraerClave, extraerItem)=>{
    const grupos = {};
    for(const it of items){
      const clave = extraerClave(it);
      if(!clave) continue;
      (grupos[clave] ??= []).push(extraerItem(it));
    }
    return Object.entries(grupos).filter(([,is])=>is.length>=2).sort(([,a],[,b])=>b.length-a.length);
  };
  const dolaresTxt = (d)=> d!=null ? `($${d.toLocaleString('en-US',{maximumFractionDigits:0})})` : '';
  const filaConsenso = (etiqueta, coin, lado, items)=>{
    const flecha = lado==='Long'?'↑':'↓';
    const nombres = items.map(({c,dolares})=>
      `<span style="display:inline-flex;align-items:center;gap:4px">${filaPlanta(c, 'trading')}<span style="font-size:.74rem;opacity:.85">${dolaresTxt(dolares)}</span></span>`
    ).join('');
    return `<div class="consenso-fila">
      <div><b>${items.length} traders ${etiqueta} ${lado} ${etiquetaMoneda(coin)} ${flecha}</b>
      <span style="opacity:.7;font-size:.76rem"> (últimas 72h)</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">${nombres}</div>
    </div>`;
  };
  const entrando = agrupar(
    trading.filter(it=>it.ts!=null && ahoraMs-it.ts<=VENTANA_CONSENSO_MS),
    it=>`${it.coin}|${it.lado}`, it=>({c:it.c, dolares: (it.tamaño!=null && it.precio!=null) ? it.tamaño*it.precio : null}),
  ).map(([clave,items])=>{ const [coin,lado]=clave.split('|'); return filaConsenso('en', coin, lado, items); });
  const cerrando = agrupar(
    Object.values(alertas).filter(a=>a.tipo==='trading' && a.tamaño===0 && a.detectado!=null && ahoraMs-a.detectado<=VENTANA_CONSENSO_MS),
    a=>`${a.coin}|${a.lado}`, a=>({c:candidatos.find(c=>c.address===a.addr), dolares: (a.tamaño_antes!=null && a.precio!=null) ? a.tamaño_antes*a.precio : null}),
  ).filter(([,items])=>items.every(({c})=>c)).map(([clave,items])=>{ const [coin,lado]=clave.split('|'); return filaConsenso('cerrando', coin, lado, items); });
  const consensoHtml = [...entrando, ...cerrando].join('');

  return `
    ${consensoHtml?`<div class="seccion-titulo">Consenso reciente</div><div class="consenso-caja">${consensoHtml}</div>`:''}
    <div class="seccion-titulo">Trading (${trading.length})</div>
    <div class="sub-panel" data-sub="trading">
      <table class="ops">
        <thead><tr>
          <th>Fecha</th><th>Dirección</th><th>Moneda</th><th>$ invertido</th><th>% de su cartera</th><th>Entrada</th><th>Trader</th><th>Resultado</th><th></th>
        </tr></thead>
        <tbody>${filasTrading}</tbody>
      </table>
    </div>
    <div class="seccion-titulo" style="margin-top:22px">Spot (${spot.length})</div>
    <div class="sub-panel" data-sub="spot">
      <table class="ops">
        <thead><tr>
          <th>Fecha</th><th>Moneda</th><th>$ invertido</th><th>% de su cartera</th><th>Trader</th><th>Valor actual</th><th>Resultado</th><th></th>
        </tr></thead>
        <tbody>${filasSpot}</tbody>
      </table>
    </div>`;
}

let cargandoResumenPropio = false;
// se guarda el ultimo grafico calculado para pintarlo de inmediato en el
// siguiente render() (cada sondeo reconstruye el HTML entero, y sin esto el
// grafico se veia parpadear: vacio un instante hasta que llegaban los
// precios nuevos, y volvia a aparecer -- con la cache no hay hueco en blanco
let ultimoGraficoMisPosicionesHtml = '';
// mismo motivo que ultimoGraficoMisPosicionesHtml: sin cache, la celda de
// "Resultado" de cada fila nacia en "..." en cada sondeo y parpadeaba hasta
// que volvia a llegar el precio en vivo
let ultimoPnlVivoPorId = {};
async function actualizarResumenPropio(){
  // win rate tuyo (de lo que ya has cerrado) es sincrono, no necesita pedir nada
  const cerradas = Object.values(misPosiciones).filter(m=>m.estado==='cerrada' && m.pnl!=null);
  const elWr = document.getElementById('n-winrate-propio');
  if(elWr) elWr.textContent = cerradas.length ? `${(cerradas.filter(m=>m.pnl>0).length/cerradas.length*100).toFixed(0)}%` : '—';

  // el PnL en vivo si necesita precios actuales -- se evita lanzar varias
  // peticiones en paralelo si render() se llama varias veces seguidas
  const abiertas = Object.entries(misPosiciones).filter(([,m])=>m.estado==='abierta');
  const elPnl = document.getElementById('n-pnl-vivo');
  if(!abiertas.length){ if(elPnl) elPnl.textContent = '$0'; return; }
  if(cargandoResumenPropio) return;
  cargandoResumenPropio = true;
  try{
    const claves = [...new Set(abiertas.map(([,m])=> `${m.coin}|${m.tipo||'trading'}`))];
    const precios = {};
    await Promise.all(claves.map(async clave=>{
      const [coin, tipo] = clave.split('|');
      try{ const {precio} = await apiGet(`/precio/${coin}?tipo=${tipo}`); precios[clave] = precio; }
      catch(e){ precios[clave] = null; }
    }));
    let total = 0, faltaDato = false;
    for(const [,m] of abiertas){
      const precio = precios[`${m.coin}|${m.tipo||'trading'}`];
      if(precio == null || m.precio_entrada == null || m.tamaño == null){ faltaDato = true; continue; }
      const signo = m.lado === 'Short' ? -1 : 1;
      total += (precio - m.precio_entrada) * m.tamaño * signo;
    }
    if(elPnl){
      elPnl.textContent = `${total>0?'+':''}$${total.toLocaleString('es-ES',{maximumFractionDigits:0})}${faltaDato?' (parcial)':''}`;
      elPnl.classList.toggle('resalta', false);
    }
  } finally {
    cargandoResumenPropio = false;
  }
}

async function cargarPnlVivoMisPosiciones(abiertas){
  // se pide el precio actual una vez por (moneda,tipo) distinta, no una vez
  // por fila -- varias posiciones abiertas pueden compartir la misma moneda
  const claves = [...new Set(abiertas.map(([,m])=> `${m.coin}|${m.tipo||'trading'}`))];
  const precios = {};
  await Promise.all(claves.map(async clave=>{
    const [coin, tipo] = clave.split('|');
    try{ const {precio} = await apiGet(`/precio/${coin}?tipo=${tipo}`); precios[clave] = precio; }
    catch(e){ precios[clave] = null; }
  }));
  const barras = [];
  for(const [id, m] of abiertas){
    const celda = document.getElementById(`pnl-vivo-${id}`);
    const precio = precios[`${m.coin}|${m.tipo||'trading'}`];
    if(precio == null || m.precio_entrada == null || m.tamaño == null){
      ultimoPnlVivoPorId[id] = {texto:'— (sin dato en vivo)', clase:''};
      if(celda) celda.textContent = ultimoPnlVivoPorId[id].texto;
      continue;
    }
    const signo = m.lado === 'Short' ? -1 : 1;
    const pnl = (precio - m.precio_entrada) * m.tamaño * signo;
    const invertido = m.precio_entrada * m.tamaño;
    const pct = invertido ? (pnl / invertido * 100) : null;
    barras.push({etiqueta: `${m.lado?m.lado+' ':''}${etiquetaMoneda(m.coin)}`, pnl, pct});
    const pctTexto = pct!=null ? ` (${pct>0?'+':''}${pct.toFixed(1)}%)` : '';
    ultimoPnlVivoPorId[id] = {texto:`${pnl>0?'+':''}$${pnl.toLocaleString('es-ES',{maximumFractionDigits:2})}${pctTexto}`, clase: pnl>0?'pos':(pnl<0?'neg':'')};
    if(celda){ // puede haber cambiado de pagina mientras se pedian los precios
      celda.textContent = ultimoPnlVivoPorId[id].texto;
      celda.classList.toggle('pos', pnl > 0);
      celda.classList.toggle('neg', pnl < 0);
    }
  }
  ultimoGraficoMisPosicionesHtml = construirGraficoPosicionesAbiertas(barras);
  const grafico = document.getElementById('grafico-mis-posiciones');
  if(grafico) grafico.innerHTML = ultimoGraficoMisPosicionesHtml;
}

function construirGraficoPosicionesAbiertas(barras){
  if(!barras.length) return '';
  const max = Math.max(1, ...barras.map(b=>Math.abs(b.pct ?? 0)));
  const filas = [...barras].sort((a,b)=>(b.pct??0)-(a.pct??0)).map(b=>{
    const pct = b.pct ?? 0;
    const ancho = Math.abs(pct)/max*50; // 50% del contenedor como mitad positiva o negativa
    const clase = pct > 0 ? 'pos' : (pct < 0 ? 'neg' : '');
    const titulo = `${b.etiqueta}: ${pct>0?'ganando':pct<0?'perdiendo':'sin cambio'} ${Math.abs(pct).toFixed(1)}% (${b.pnl>0?'+':''}$${b.pnl.toLocaleString('es-ES',{maximumFractionDigits:0})})`;
    const barraHtml = pct >= 0
      ? `<div class="gb-mitad gb-izq"></div><div class="gb-mitad gb-der"><div class="gb-barra ${clase}" style="width:${ancho}%"></div></div>`
      : `<div class="gb-mitad gb-izq"><div class="gb-barra ${clase}" style="width:${ancho}%;margin-left:auto"></div></div><div class="gb-mitad gb-der"></div>`;
    const valorTxt = `${pct>0?'+':''}${pct.toFixed(1)}% (${b.pnl>0?'+':''}$${b.pnl.toLocaleString('es-ES',{maximumFractionDigits:0})})`;
    return `<div class="gb-fila" title="${titulo}">
      <div class="gb-etiqueta">${b.etiqueta}</div>
      <div class="gb-pista">${barraHtml}</div>
      <div class="gb-valor ${clase}">${valorTxt}</div>
    </div>`;
  }).join('');
  return `<div class="seccion-titulo" style="margin-top:4px">Tus posiciones</div>
    <div class="gb-leyenda">Cada barra compara tus posiciones entre sí ahora mismo. ← pierdes · ganas →, partiendo del centro.</div>
    <div class="grafico-barras">${filas}</div>`;
}

function construirSvgLinea(valores){
  if(valores.length < 2) return '<div class="estado">Aún no hay suficientes cierres para graficar.</div>';
  const w = 600, h = 160, pad = 6;
  const min = Math.min(0, ...valores), max = Math.max(0, ...valores);
  const rango = (max - min) || 1;
  const x = i => pad + i*(w-2*pad)/(valores.length-1);
  const y = v => h-pad - (v-min)*(h-2*pad)/rango;
  const puntos = valores.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const color = valores[valores.length-1] >= 0 ? 'var(--ok)' : 'var(--bad)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:160px;display:block">
    <line x1="${pad}" y1="${y(0).toFixed(1)}" x2="${w-pad}" y2="${y(0).toFixed(1)}" stroke="var(--border)" stroke-dasharray="4 4"/>
    <polyline points="${puntos}" fill="none" stroke="${color}" stroke-width="2"/>
  </svg>`;
}

function renderPaginaStats(){
  // esto es TU resultado (lo que tu mismo has abierto desde "Posiciones
  // abiertas" y luego cerrado), no el de los traders que sigues -- por eso
  // esta a cero mientras no hayas abierto y cerrado nada todavia.
  const cierres = Object.values(misPosiciones).filter(m=>m.estado==='cerrada' && m.pnl!=null);
  if(!cierres.length) return '<div class="estado">Todavía no has cerrado ninguna posición propia — esto se rellena cuando abras algo desde "Posiciones abiertas" y luego lo cierres.</div>';
  cierres.sort((a,b)=>a.fecha_cierre-b.fecha_cierre);

  let acumulado = 0;
  const serie = cierres.map(c=>{ acumulado += c.pnl; return acumulado; });

  const ganadores = cierres.filter(c=>c.pnl>0);
  const perdedores = cierres.filter(c=>c.pnl<0);
  const gananciaBruta = ganadores.reduce((s,c)=>s+c.pnl, 0);
  const perdidaBruta = perdedores.reduce((s,c)=>s+c.pnl, 0);
  const neto = gananciaBruta + perdidaBruta;
  const winRate = ganadores.length / cierres.length * 100;
  const fmt = n => `${n>=0?'+':''}$${n.toLocaleString('es-ES',{maximumFractionDigits:0})}`;

  const filasCierres = [...cierres].reverse().map(m=>{
    const c = candidatos.find(x=>x.address===m.addr);
    const pnlClase = m.pnl > 0 ? 'pos' : (m.pnl < 0 ? 'neg' : '');
    return `<tr>
      <td>${new Date(m.fecha_cierre).toLocaleDateString('es-ES')}</td>
      <td>${c?filaPlanta(c, m.lado?'trading':'spot'):(m.addr||'').slice(0,8)}</td>
      <td>${m.lado?`<span class="op-lado ${m.lado.toLowerCase()}">${m.lado}</span>`:'Spot'}</td>
      <td>${m.coin}</td>
      <td><span class="op-pnl ${pnlClase}">${fmt(m.pnl)}</span></td>
    </tr>`;
  }).join('');

  return `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px">
      <div class="stat-caja"><div class="l">Neto (${cierres.length} cierres)</div><div class="v" style="color:${neto>=0?'var(--ok)':'var(--bad)'}">${fmt(neto)}</div></div>
      <div class="stat-caja"><div class="l">Ganado</div><div class="v" style="color:var(--ok)">${fmt(gananciaBruta)}</div></div>
      <div class="stat-caja"><div class="l">Perdido</div><div class="v" style="color:var(--bad)">${fmt(perdidaBruta)}</div></div>
      <div class="stat-caja"><div class="l">Win rate</div><div class="v">${winRate.toFixed(0)}%</div></div>
    </div>
    <div class="seccion-titulo">Evolución acumulada (tus ${cierres.length} cierres)</div>
    <div class="stat-caja" style="margin-bottom:22px">${construirSvgLinea(serie)}</div>
    <div class="seccion-titulo">Historial de tus cierres</div>
    <table class="ops">
      <thead><tr><th>Fecha</th><th>Copiada de</th><th>Dirección</th><th>Moneda</th><th>Resultado</th></tr></thead>
      <tbody>${filasCierres}</tbody>
    </table>`;
}

function renderGraficoMonedas(){
  // cuantos traders (de todos los que tenemos, sigan o no) tienen AHORA
  // MISMO algo abierto en cada moneda -- trading y spot cuentan igual, es
  // solo para hacerse una idea rapida de donde esta puesto el dinero
  const conteo = {};
  for(const c of candidatos){
    const monedas = new Set();
    for(const p of (c.posicion_actual||[])) monedas.add(etiquetaMoneda(p.coin));
    for(const h of (c.holdings_spot||[])) monedas.add(etiquetaMoneda(h.coin));
    monedas.forEach(m=> conteo[m] = (conteo[m]||0) + 1);
  }
  const top = Object.entries(conteo).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(!top.length) return '';
  const max = top[0][1];
  return `
    <div class="gm-titulo">Monedas con más traders dentro ahora mismo</div>
    ${top.map(([coin,n])=>`
      <div class="gm-fila">
        <span class="gm-moneda">${coin}</span>
        <div class="gm-barra-fondo"><div class="gm-barra" style="width:${Math.max(6,n/max*100)}%"></div></div>
        <span class="gm-n">${n}</span>
      </div>`).join('')}`;
}

function render(){
  const root = document.getElementById('root');
  if(!candidatos.length){ root.innerHTML = '<div class="estado">Sin datos todavía.</div>'; return; }
  try{
  asignarPlantas(candidatos);
  document.getElementById('grafico-monedas').innerHTML = renderGraficoMonedas();

  const nSig = candidatos.filter(c=>c.siguiendo).length;
  const elSig = document.getElementById('n-siguiendo');
  if(elSig.textContent !== '' && elSig.textContent !== String(nSig)){
    elSig.classList.add('resalta');
    setTimeout(()=>elSig.classList.remove('resalta'), 350);
  }
  elSig.textContent = nSig;
  document.getElementById('n-total').textContent = candidatos.length;

  const seguro = (fn, nombre)=>{
    try{ return fn(); }
    catch(e){ console.error('fallo renderizando ' + nombre, e); return `<div class="estado">Error renderizando "${nombre}": ${e.message}</div>`; }
  };

  root.innerHTML = `
    <div class="page-panel ${paginaActiva==='seguimiento'?'':'oculto'}" data-pagina="seguimiento">${seguro(renderPaginaSeguimiento,'seguimiento')}</div>
    <div class="page-panel ${paginaActiva==='posiciones'?'':'oculto'}" data-pagina="posiciones">${seguro(renderPaginaPosiciones,'posiciones de seguimiento')}</div>
    <div class="page-panel ${paginaActiva==='mias'?'':'oculto'}" data-pagina="mias">${seguro(renderPaginaMias,'posiciones abiertas')}</div>
    <div class="page-panel ${paginaActiva==='stats'?'':'oculto'}" data-pagina="stats">${seguro(renderPaginaStats,'estadísticas')}</div>`;

  root.querySelectorAll('.btn-borrar-candidato').forEach(btn=>{
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      const addr = btn.dataset.addr;
      if(!confirm(`¿Quitar a ${btn.dataset.planta} de la lista del todo? Esto no se puede deshacer.`)) return;
      btn.disabled = true;
      try{
        await apiEnviar('DELETE', `/candidatos/${addr}`);
        candidatos = candidatos.filter(c=>c.address!==addr);
        render();
      }catch(e){
        console.error('fallo al borrar candidato', e);
        btn.disabled = false;
      }
    };
  });

  root.querySelectorAll('.sw').forEach(btn=>{
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      const addr = btn.dataset.addr;
      const faceta = btn.dataset.faceta;
      const nuevoEstado = btn.dataset.on !== '1';
      const cuerpo = faceta==='trading' ? {sigue_trading: nuevoEstado}
        : faceta==='spot' ? {sigue_spot: nuevoEstado}
        : {sigue_trading: nuevoEstado, sigue_spot: nuevoEstado};
      btn.disabled = true;
      try{
        await apiEnviar('PATCH', `/candidatos/${addr}`, cuerpo);
        const c = candidatos.find(x=>x.address===addr);
        if(c){
          if('sigue_trading' in cuerpo) c.sigue_trading = cuerpo.sigue_trading;
          if('sigue_spot' in cuerpo) c.sigue_spot = cuerpo.sigue_spot;
          c.siguiendo = c.sigue_trading || c.sigue_spot;
        }
        render();
      }catch(e){
        console.error('fallo al guardar', e);
      }finally{
        btn.disabled = false;
      }
    };
  });

  root.querySelectorAll('[data-abre-modal], .pf-trader').forEach(card=>{
    card.onclick = ()=>{
      const c = candidatos.find(x=>x.address===card.dataset.addr);
      // en la lista de candidatos el filtro de la pestaña decide la faceta;
      // en las tablas de posiciones cada fila ya trae la suya en data-faceta
      const faceta = card.dataset.faceta || filtroActividad;
      if(c) abrirModal(c, faceta);
    };
  });

  root.querySelectorAll('.filtro-pill[data-filtro]').forEach(btn=>{
    btn.onclick = ()=>{
      filtroActividad = btn.dataset.filtro;
      render();
    };
  });
  root.querySelectorAll('.filtro-pill[data-orden]').forEach(btn=>{
    btn.onclick = ()=>{
      ordenAsc = !ordenAsc;
      render();
    };
  });

  root.querySelectorAll('[data-forzar-descubrimiento]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      const textoOriginal = btn.textContent;
      btn.textContent = 'Recalculando…';
      try{
        await apiEnviar('POST', '/admin/forzar_descubrimiento', {});
        btn.textContent = 'Lanzado, tardará unos minutos';
      }catch(e){
        console.error('fallo al forzar el descubrimiento', e);
        btn.textContent = 'Error, mira la consola';
      }
      setTimeout(()=>{ btn.disabled = false; btn.textContent = textoOriginal; }, 8000);
    };
  });

  root.querySelectorAll('.op-flecha').forEach(fl=>{
    fl.onclick = (ev)=>{
      ev.stopPropagation();
      const id = fl.dataset.bloque;
      const seAbre = fl.textContent === '▸';
      fl.textContent = seAbre ? '▾' : '▸';
      if(seAbre) expandidos.add(id); else expandidos.delete(id);
      root.querySelectorAll(`[data-hijo-de="${id}"]`).forEach(tr=> tr.classList.toggle('oculto', !seAbre));
    };
  });

  root.querySelectorAll('.btn-abrir').forEach(btn=>{
    btn.onclick = async ()=>{
      const {id, addr, tipo, coin} = btn.dataset;
      const lado = btn.dataset.lado || null;
      const tamañoTrader = btn.dataset.tamanoTrader ? parseFloat(btn.dataset.tamanoTrader) : null;
      btn.disabled = true;
      let precio;
      try{
        ({precio} = await apiGet(`/precio/${coin}?tipo=${tipo}`));
      }catch(e){
        console.error('fallo al pedir el precio actual', e);
        btn.disabled = false;
        return;
      }
      btn.disabled = false;
      modalCantidad({titulo:'Abrir posición', coin, lado, precio, onConfirmar: async (tamaño)=>{
        try{
          await apiEnviar('POST', '/mis_posiciones', {id, addr, tipo, coin, lado, tamaño, precio_entrada: precio, tamaño_trader: tamañoTrader});
          misPosiciones[id] = {addr, tipo, coin, lado, estado:'abierta', fecha_apertura:Date.now(), tamaño, precio_entrada: precio};
          render();
        }catch(e){
          console.error('fallo al abrir posicion', e);
        }
      }});
    };
  });

  root.querySelectorAll('.btn-añadir').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const m = misPosiciones[id];
      if(!m) return;
      btn.disabled = true;
      let precio;
      try{
        ({precio} = await apiGet(`/precio/${m.coin}?tipo=${m.tipo}`));
      }catch(e){
        console.error('fallo al pedir el precio actual', e);
        btn.disabled = false;
        return;
      }
      btn.disabled = false;
      modalCantidad({titulo:'Añadir a tu posición', coin:m.coin, lado:m.lado, precio, onConfirmar: async (tamañoAdicional)=>{
        try{
          const res = await apiEnviar('PATCH', `/mis_posiciones/${id}/añadir`, {tamaño_adicional: tamañoAdicional, precio});
          misPosiciones[id] = {...m, tamaño: res.tamaño, precio_entrada: res.precio_entrada};
          render();
        }catch(e){
          console.error('fallo al añadir a la posicion', e);
        }
      }});
    };
  });

  root.querySelectorAll('.btn-reducir').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const m = misPosiciones[id];
      if(!m) return;
      btn.disabled = true;
      let precio;
      try{
        ({precio} = await apiGet(`/precio/${m.coin}?tipo=${m.tipo||'trading'}`));
      }catch(e){
        console.error('fallo al pedir el precio actual', e);
        btn.disabled = false;
        return;
      }
      btn.disabled = false;
      const maxDolares = m.tamaño * precio;
      modalCantidad({titulo:`Reducir posición (máx. $${maxDolares.toLocaleString('es-ES',{maximumFractionDigits:0})})`, coin:m.coin, lado:m.lado, precio, onConfirmar: async (tamañoPedido)=>{
        const tamañoReducido = Math.min(tamañoPedido, m.tamaño);
        try{
          const res = await apiEnviar('PATCH', `/mis_posiciones/${id}/reducir`, {tamaño_reducido: tamañoReducido, precio});
          if(res.resto <= m.tamaño * 0.001){
            misPosiciones[id] = {...m, estado:'cerrada', pnl: res.pnl, fecha_cierre:Date.now()};
          } else {
            misPosiciones[id] = {...m, tamaño: res.resto};
          }
          render();
        }catch(e){
          console.error('fallo al reducir posicion', e);
        }
      }});
    };
  });

  root.querySelectorAll('.btn-cerrar').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const m = misPosiciones[id];
      if(!m) return;
      const texto = prompt(`¿Cuánto has ganado o perdido cerrando ${m.coin}? (en $, negativo si has perdido)`);
      if(texto === null) return;
      const pnl = parseFloat(texto.replace(',', '.'));
      if(isNaN(pnl)){ alert('Eso no es un número.'); return; }
      btn.disabled = true;
      try{
        await apiEnviar('PATCH', `/mis_posiciones/${id}`, {pnl});
        misPosiciones[id] = {...m, estado:'cerrada', pnl, fecha_cierre:Date.now()};
        render();
      }catch(e){
        console.error('fallo al cerrar posicion', e);
        btn.disabled = false;
      }
    };
  });

  if(paginaActiva === 'mias'){
    const abiertas = Object.entries(misPosiciones).filter(([,m])=>m.estado==='abierta');
    if(abiertas.length) cargarPnlVivoMisPosiciones(abiertas);
  }

  actualizarResumenPropio();
  actualizarBadgesTabs();
  }catch(e){
    console.error('fallo renderizando la pagina', e);
    root.innerHTML = `<div class="estado">Error cargando la página: ${e.message}</div>`;
  }
}

function hayAperturaNuevaDesdeUltimaVisita(){
  // solo cuenta como "nuevo" una apertura DE VERDAD (primer movimiento del
  // bloque es un "Abre" posterior a tu última visita y tenemos su origen
  // completo) -- un simple añadido a una posición ya existente no cuenta,
  // ni tampoco una posición de la que no tenemos el inicio.
  if(!ultimaVisitaAnterior) return false;
  for(const c of candidatos){
    if(c.sigue_trading) for(const p of (c.posicion_actual||[])){
      const b = bloqueDePosicion(c, p.lado, p.coin);
      const primera = b && b.filas.length ? b.filas[0] : null;
      if(primera && primera.accion==='Abre' && !b.truncada && esReciente(primera.ts)) return true;
    }
    if(c.sigue_spot) for(const h of (c.holdings_spot||[])){
      const b = bloqueDePosicion(c, 'Spot', h.coin);
      const primera = b && b.filas.length ? b.filas[0] : null;
      if(primera && primera.accion==='Abre' && !b.truncada && esReciente(primera.ts)) return true;
    }
  }
  return false;
}

function hayDescubrimientoNuevoDesdeUltimaVisita(){
  if(!ultimaVisitaAnterior) return false;
  return candidatos.some(c=> esReciente(c.descubierto_ts));
}

  // "Posiciones abiertas" NO lleva punto -- lo que hay ahi lo abres tu

function agruparEpisodios(ops){
  // el exchange parte una sola decision en muchos fills pequenos ejecutados
  // en el mismo minuto; se agrupan por moneda+lado+accion+minuto en una sola fila
  const grupos = [];
  const indice = {};
  for(const o of ops){
    const clave = `${o.coin}|${o.lado}|${o.accion}|${o.time}`;
    if(indice[clave] == null){
      indice[clave] = grupos.length;
      grupos.push({coin:o.coin, lado:o.lado, accion:o.accion, time:o.time, ts:o.ts, sz:0, notional:0, closedPnl:0, nFills:0});
    }
    const g = grupos[indice[clave]];
    g.sz += o.sz; g.notional += o.notional||0; g.closedPnl += o.closedPnl||0; g.nFills += 1;
  }
  return grupos.map(g=>({...g, sz: +g.sz.toPrecision(8), notional: Math.round(g.notional), closedPnl: +g.closedPnl.toFixed(2), px: g.sz ? +(g.notional/g.sz).toPrecision(6) : 0}));
}

function construirBloques(ops){
  // ops viene de mas reciente a mas antigua; se procesa en orden cronologico para
  // detectar rachas de "ir añadiendo/reduciendo la misma posicion" por moneda+lado,
  // de forma que no se interrumpan visualmente con operaciones de otras monedas.
  const cronologico = [...ops].reverse();
  const bloques = [];
  const abiertoPorClave = {};
  for(const o of cronologico){
    if(o.lado !== 'Long' && o.lado !== 'Short' && o.lado !== 'Spot'){
      bloques.push({coin:o.coin, lado:'', filas:[o], neto:0, abierta:false});
      continue;
    }
    const clave = `${o.coin}|${o.lado}`;
    let idx = abiertoPorClave[clave];
    if(idx == null){
      idx = bloques.length;
      // si el primer movimiento que vemos de esta posicion ya es un "Cierra",
      // es que la posicion existia antes de lo que tenemos en estos datos:
      // no sabemos su tamaño real, solo lo que cambia a partir de aqui.
      bloques.push({coin:o.coin, lado:o.lado, filas:[], neto:0, totalAbierto:0, abierta:true, truncada: o.accion === 'Cierra'});
      abiertoPorClave[clave] = idx;
    }
    const b = bloques[idx];
    b.filas.push(o);
    if(o.accion === 'Abre') b.totalAbierto = +(b.totalAbierto + o.sz).toPrecision(8);
    b.neto = +(b.neto + (o.accion === 'Abre' ? o.sz : -o.sz)).toPrecision(8);
    if(Math.abs(b.neto) < 0.00001){
      b.abierta = false;
      delete abiertoPorClave[clave];
    }
  }
  return bloques.reverse(); // mas reciente primero
}
