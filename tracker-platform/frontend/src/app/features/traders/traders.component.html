@switch (vista()) {
  @case ('posiciones') {
    <app-posiciones />
  }
  @case ('cribado') {
    <app-cribado />
  }
  @default {
    <div class="mb-3.5 flex flex-wrap items-center justify-between gap-2.5">
      <div class="flex items-center gap-1.5">
        <div class="font-display text-lg font-semibold">{{ titulo() }}</div>
        <span class="rounded-pill bg-border px-2.5 py-0.5 text-xs font-bold text-fg-muted">
          {{ contadorSiguiendo() }}/{{ tradersFiltrados().length }}
        </span>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <p-button
          label="Filtros"
          icon="pi pi-filter"
          [badge]="filtrosActivos() ? filtrosActivos() + '' : undefined"
          severity="secondary"
          (onClick)="panelFiltros.toggle($event)"
        />
      </div>
    </div>

    <p-popover #panelFiltros>
      <div class="flex w-[46rem] max-w-[90vw] flex-col gap-4">
        <div class="grid grid-cols-3 gap-4">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-fg-muted">Retorno mín. %</label>
            <p-inputnumber placeholder="Retorno mín. %" size="small" [ngModel]="retornoMin()" (ngModelChange)="retornoMin.set($event)" />
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-fg-muted">Categoría</label>
            <p-select [options]="categorias" optionLabel="label" optionValue="value" size="small" [ngModel]="categoriaFiltro()" (ngModelChange)="categoriaFiltro.set($event)" />
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-fg-muted" title="Deja solo traders que operen alguna de las monedas marcadas -- útil para descartar a quien puntúa alto pero opera monedas raras/ilíquidas que no conoces">
              Monedas
            </label>
            <p-multiselect
              [options]="opcionesMonedas()"
              optionLabel="label"
              optionValue="value"
              placeholder="Todas"
              size="small"
              display="chip"
              [ngModel]="monedasFiltro()"
              (ngModelChange)="monedasFiltro.set($event)"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-fg-muted">Ordenar por</label>
            <p-select [options]="camposOrden" optionLabel="label" optionValue="value" size="small" [ngModel]="campoOrden()" (ngModelChange)="campoOrden.set($event)" />
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-fg-muted">Dirección</label>
            <p-button
              [label]="ordenAsc() ? 'Ascendente' : 'Descendente'"
              [icon]="ordenAsc() ? 'pi pi-sort-amount-up' : 'pi pi-sort-amount-down'"
              severity="secondary"
              size="small"
              (onClick)="ordenAsc.set(!ordenAsc())"
            />
          </div>

          <div class="flex flex-col justify-end gap-1.5 pb-1">
            <label class="flex items-center gap-1.5 text-sm text-fg-muted">
              <input type="checkbox" [ngModel]="soloSeguidos()" (ngModelChange)="soloSeguidos.set($event)" />
              Solo los que sigo
            </label>
          </div>
        </div>

        <div class="flex justify-end border-t border-border pt-3">
          <p-button
            label="Limpiar filtros"
            severity="secondary"
            [text]="true"
            size="small"
            (onClick)="retornoMin.set(null); categoriaFiltro.set(null); monedasFiltro.set([]); soloSeguidos.set(false)"
          />
        </div>
      </div>
    </p-popover>

    <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2 lg:grid-cols-3">
      @for (t of tradersFiltrados(); track t.address) {
        <app-trader-card [trader]="t" (seguirCambiado)="alternarSeguir(t, $event)" (detalleAbierto)="abrirDetalle(t)" />
      } @empty {
        <div class="col-span-full py-10 text-center text-base text-fg-muted">Nadie tiene puntuación en esta categoría todavía.</div>
      }
    </div>

    <app-trader-detail-modal [(visible)]="detalleAbierto" [candidato]="detalleCandidato()" [faceta]="detalleFaceta()" />
  }
}
