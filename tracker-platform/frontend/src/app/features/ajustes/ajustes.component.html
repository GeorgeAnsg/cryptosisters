<div class="mb-3.5 font-display text-lg font-semibold">Ajustes</div>

<p-tabs value="activos">
  <div class="panel overflow-hidden">
    <p-tablist class="px-4">
      <p-tab value="activos">Activos</p-tab>
      <p-tab value="cribado">Cribado</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="activos">
        <div class="p-panel">
          <div class="flex flex-col gap-5">
            @for (grupo of grupos(); track grupo.categoria) {
              <div>
                <div class="mb-1.5 text-xs font-semibold uppercase tracking-wide text-fg-muted">{{ grupo.categoria }}</div>
                <div class="grid grid-cols-1 gap-x-6 gap-y-1 sm:grid-cols-3">
                  @for (activo of grupo.activos; track activo) {
                    <div class="flex items-center justify-between gap-2 rounded-lg px-2 py-1.5">
                      <span class="text-sm font-medium">{{ activo }}</span>
                      <p-toggleswitch [ngModel]="activa(activo)" (ngModelChange)="alternar(activo, $event)" />
                    </div>
                  }
                </div>
              </div>
            }
          </div>
          <div class="mt-5">
            <p-button label="Guardar" [loading]="guardando()" (onClick)="guardar()" />
          </div>
        </div>
      </p-tabpanel>
      <p-tabpanel value="cribado">
        <div class="p-panel">
          <app-cribado />
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </div>
</p-tabs>
