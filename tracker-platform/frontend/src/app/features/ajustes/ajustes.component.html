<div class="mb-3.5 font-display text-lg font-semibold">Ajustes</div>

<p-tabs value="monedas">
  <div class="panel overflow-hidden">
    <p-tablist class="px-4">
      <p-tab value="monedas">Monedas</p-tab>
      <p-tab value="cribado">Cribado</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="monedas">
        <div class="p-panel">
          <div class="grid grid-cols-1 gap-x-6 gap-y-1 sm:grid-cols-3">
            @for (moneda of monedasDisponibles(); track moneda) {
              <div class="flex items-center justify-between gap-2 rounded-lg px-2 py-1.5">
                <span class="text-sm font-medium">{{ moneda }}</span>
                <p-toggleswitch [ngModel]="activa(moneda)" (ngModelChange)="alternar(moneda, $event)" />
              </div>
            }
          </div>
          <div class="mt-4">
            <p-button label="Guardar" [loading]="guardando()" (onClick)="guardar()" />
          </div>
        </div>
      </p-tabpanel>
      <p-tabpanel value="cribado">
        <div class="p-panel">
          <app-cribado />
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </div>
</p-tabs>
